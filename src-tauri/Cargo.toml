[package]
name = "atalocal"
version = "0.3.2"
description = "Transcricao e ata de reunioes presenciais, 100% local"
authors = ["AtaLocal"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "atalocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Banco local
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Diagnostico de sistema
sysinfo = "0.32"

# Captura de audio
cpal = "0.15"
# Codificacao FLAC (sem perda) — encoder 100% Rust, sem dependencia de sistema.
# Captura escreve WAV incremental; a etapa `finalizing` converte para FLAC.
flacenc = "0.5"
# Decodificacao FLAC (leitura, para reprocessar o audio ja gravado)
claxon = "0.4"
# Extracao de pacotes: Sherpa em .tar.bz2, llama.cpp em .zip
tar = "0.4"
bzip2 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Transcricao: bindings do whisper.cpp (compila libwhisper via cmake, backend CPU)
whisper-rs = "0.16"
# Diarizacao: o sherpa-onnx roda como SUBPROCESSO (binario pre-compilado).
# Suas libs C++ conflitam com o whisper.cpp quando linkadas no mesmo .exe
# (crash 0x80000003 ao carregar o modelo). Ver docs/adr/0005-*.md.

# Download de modelos. TLS via Schannel (native-tls) para nao arrastar o crate
# `ring`, cujo build-script e bloqueado pela politica de seguranca desta maquina.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"

# Utilidades
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
directories = "5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
