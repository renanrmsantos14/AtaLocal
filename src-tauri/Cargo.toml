[package]
name = "atalocal"
version = "0.1.0"
description = "Transcricao e ata de reunioes presenciais, 100% local"
authors = ["AtaLocal"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "atalocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Banco local
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Diagnostico de sistema
sysinfo = "0.32"

# Captura de audio (Fase 1: enumeracao; Fase 2: gravacao)
cpal = "0.15"

# Download de modelos
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"

# Utilidades
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
directories = "5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
